name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # v3.0.0-dev.N tags are prereleases: HACS only offers them to users who
          # opted in to beta versions
          prerelease: ${{ contains(github.ref_name, '-dev') }}
          generate_release_notes: true

